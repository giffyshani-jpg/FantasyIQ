openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sports
    description: Sports data proxy operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /euroleague/results:
    get:
      operationId: getEuroleagueResults
      tags: [sports]
      summary: Get EuroLeague results and fixtures
      description: Proxies the official EuroLeague results feed and returns normalized games.
      parameters:
        - name: seasoncode
          in: query
          required: false
          schema:
            type: string
            default: E2026
            pattern: "^[A-Z][A-Z0-9]{4,7}$"
      responses:
        "200":
          description: Normalized EuroLeague games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EuroleagueGame"
        "502":
          description: Official feed unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EuroleagueGame:
      type: object
      required:
        - id
        - seasonCode
        - date
        - time
        - gameCode
        - homeTeam
        - awayTeam
        - played
      properties:
        id:
          type: string
        seasonCode:
          type: string
        date:
          type: string
        time:
          type: string
        gameCode:
          type: string
        round:
          type: string
        gameDay:
          type: integer
        group:
          type: string
        homeTeam:
          type: object
          required: [name, code, score]
          properties:
            name: { type: string }
            code: { type: string }
            score: { type: ["integer", "null"] }
        awayTeam:
          type: object
          required: [name, code, score]
          properties:
            name: { type: string }
            code: { type: string }
            score: { type: ["integer", "null"] }
        played:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

